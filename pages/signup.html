<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a LifeSync account.">
    <title>Sign Up | LifeSync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/person2.css">
</head>
<body class="auth-body">
    <main class="auth-page">
        <div class="container">
            <div class="auth-layout">
                <section class="auth-intro">
                    <a class="navbar-brand lifesync-brand auth-brand" href="login.html" aria-label="LifeSync login">
                        <span class="brand-mark" aria-hidden="true">L</span><span>LifeSync</span>
                    </a>
                </section>

                <section class="auth-card" aria-labelledby="signupHeading">
                    <h1 id="signupHeading">Create your account</h1>
                    <p class="auth-card-copy">Enter your details to get started.</p>

                    <div id="authMessage" class="auth-message" role="alert" aria-live="polite" hidden></div>

                    <form id="signupForm" novalidate>
                        <div class="mb-3">
                            <label for="signupName" class="form-label">Full name</label>
                            <input type="text" class="form-control" id="signupName" name="name" autocomplete="name" maxlength="100" placeholder="Your name" required>
                        </div>
                        <div class="mb-3">
                            <label for="signupEmail" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="signupEmail" name="email" autocomplete="email" maxlength="254" placeholder="you@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="signupPassword" class="form-label">Password <span class="auth-field-hint">(at least 8 characters)</span></label>
                            <div class="auth-password-field">
                                <input type="password" class="form-control" id="signupPassword" name="password" autocomplete="new-password" minlength="8" required>
                                <button class="auth-password-toggle" type="button" data-password-toggle="signupPassword" aria-label="Show password" aria-pressed="false">Show</button>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="signupConfirmPassword" class="form-label">Confirm password</label>
                            <div class="auth-password-field">
                                <input type="password" class="form-control" id="signupConfirmPassword" name="confirmPassword" autocomplete="new-password" minlength="8" required>
                                <button class="auth-password-toggle" type="button" data-password-toggle="signupConfirmPassword" aria-label="Show confirmation password" aria-pressed="false">Show</button>
                            </div>
                        </div>
                        <button class="btn lifesync-primary-btn auth-submit" id="signupSubmit" type="submit">Create account</button>
                    </form>

                    <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
                </section>
            </div>
        </div>
    </main>
    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
