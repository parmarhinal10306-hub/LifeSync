<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to LifeSync.">
    <title>Login | LifeSync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/person2.css">
</head>
<body class="auth-body">
    <main class="auth-page">
        <div class="container">
            <div class="auth-layout">
                <section class="auth-intro">
                    <a class="navbar-brand lifesync-brand auth-brand" href="login.html" aria-label="LifeSync login">
                        <span class="brand-mark" aria-hidden="true">L</span><span>LifeSync</span>
                    </a>
                </section>

                <section class="auth-card" aria-labelledby="loginHeading">
                    <h1 id="loginHeading">Welcome back</h1>
                    <p class="auth-card-copy">Log in to continue to LifeSync.</p>

                    <div id="authMessage" class="auth-message" role="alert" aria-live="polite" hidden></div>

                    <form id="loginForm" novalidate>
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="loginEmail" name="email" autocomplete="email" placeholder="you@example.com" maxlength="254" required>
                        </div>
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">Password</label>
                            <div class="auth-password-field">
                                <input type="password" class="form-control" id="loginPassword" name="password" autocomplete="current-password" required>
                                <button class="auth-password-toggle" type="button" data-password-toggle="loginPassword" aria-label="Show password" aria-pressed="false">Show</button>
                            </div>
                        </div>
                        <div class="auth-form-options">
                            <label class="auth-remember" for="rememberMe">
                                <input class="form-check-input" type="checkbox" id="rememberMe">
                                <span>Remember me</span>
                            </label>
                        </div>
                        <button class="btn lifesync-primary-btn auth-submit" id="loginSubmit" type="submit">Log in</button>
                    </form>

                    <p class="auth-switch">New to LifeSync? <a href="signup.html">Create an account</a></p>
                </section>
            </div>
        </div>
    </main>
    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
