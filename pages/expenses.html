<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses | LifeSync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/person2.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light lifesync-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand lifesync-brand" href="../index.html">
                <span class="brand-mark" aria-hidden="true">L</span><span>LifeSync</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="tasks.html">Tasks</a></li>
                    <li class="nav-item"><a class="nav-link" href="calendar.html">Calendar</a></li>
                    <li class="nav-item"><a class="nav-link" href="habits.html">Habits</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="expenses.html">Expenses</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="feature-page">
        <div class="container">
            <!-- Page heading -->
            <div class="feature-page-heading">
                <div>
                    <p class="section-eyebrow">LifeSync Expenses</p>
                    <h1>Expense Manager</h1>
                </div>
                <button class="btn lifesync-primary-btn" type="button" data-bs-toggle="modal" data-bs-target="#expenseModal">
                    Add expense
                </button>
            </div>

            <!-- Summary cards -->
            <div class="row g-4 mb-4">
                <div class="col-md-4">
                    <article class="dashboard-stat-card">
                        <p>Total expenses</p>
                        <strong id="totalExpenseAmount">&#8377;0.00</strong>
                    </article>
                </div>
                <div class="col-md-4">
                    <article class="dashboard-stat-card">
                        <p>Number of records</p>
                        <strong id="totalExpenseCount">0</strong>
                    </article>
                </div>
                <div class="col-md-4">
                    <article class="dashboard-stat-card">
                        <p>Categories used</p>
                        <strong id="categoriesUsedCount">0</strong>
                    </article>
                </div>
            </div>

            <div class="row g-4">
                <!-- Category-wise spending -->
                <div class="col-lg-5">
                    <section class="dashboard-panel category-panel" aria-labelledby="categoryHeading">
                        <div class="panel-heading mb-3">
                            <div>
                                <p class="section-eyebrow">Breakdown</p>
                                <h3 id="categoryHeading">Spending by category</h3>
                            </div>
                        </div>
                        <div id="categoryBreakdown"></div>
                    </section>
                </div>

                <!-- Expense history -->
                <div class="col-lg-7">
                    <section class="task-column" aria-labelledby="expenseHistoryHeading">
                        <div class="task-column-heading">
                            <h2 id="expenseHistoryHeading">Expense History</h2>
                            <span id="expenseCountBadge" class="task-count">0</span>
                        </div>
                        <div id="expenseList" class="task-list"></div>
                    </section>
                </div>
            </div>
        </div>

        <!-- Add Expense Modal -->
        <div class="modal fade" id="expenseModal" tabindex="-1" aria-labelledby="expenseModalTitle" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content lifesync-modal">
                    <div class="modal-header">
                        <h2 class="modal-title fs-5" id="expenseModalTitle">Add expense</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form id="expenseForm">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="expenseTitle" class="form-label">Title</label>
                                <input type="text" class="form-control" id="expenseTitle" placeholder="e.g. Grocery shopping" maxlength="100" required>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-sm-6">
                                    <label for="expenseAmount" class="form-label">Amount (&#8377;)</label>
                                    <input type="number" class="form-control" id="expenseAmount" placeholder="0.00" min="0.01" step="0.01" required>
                                </div>
                                <div class="col-sm-6">
                                    <label for="expenseCategory" class="form-label">Category</label>
                                    <select class="form-select" id="expenseCategory" required>
                                        <option value="">Select category</option>
                                        <option value="Food">Food</option>
                                        <option value="Transport">Transport</option>
                                        <option value="Shopping">Shopping</option>
                                        <option value="Bills">Bills</option>
                                        <option value="Entertainment">Entertainment</option>
                                        <option value="Health">Health</option>
                                        <option value="Education">Education</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="expenseDate" class="form-label">Date</label>
                                <input type="date" class="form-control" id="expenseDate" required>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn lifesync-secondary-btn" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn lifesync-primary-btn">Save expense</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="lifesync-footer">
        <div class="container">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
                <a class="footer-brand" href="../index.html">LifeSync</a>
                <p class="mb-0">&copy; <span id="currentYear"></span> LifeSync. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/expenses.js"></script>
</body>
</html>
