<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks | LifeSync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light lifesync-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand lifesync-brand" href="../index.html">
                <span class="brand-mark" aria-hidden="true">L</span><span>LifeSync</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="tasks.html">Tasks</a></li>
                    <li class="nav-item"><a class="nav-link" href="calendar.html">Calendar</a></li>
                    <li class="nav-item"><a class="nav-link" href="habits.html">Habits</a></li>
                    <li class="nav-item"><a class="nav-link" href="expenses.html">Expenses</a></li>
                    <li class="nav-item"><a class="nav-link" href="study-planner.html">Study Planner</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="feature-page">
        <div class="container">
            <div class="feature-page-heading">
                <div>
                    <p class="section-eyebrow">LifeSync Tasks</p>
                    <h1>Task Manager</h1>
                </div>
                <button class="btn lifesync-primary-btn" type="button" data-bs-toggle="modal" data-bs-target="#taskModal">
                    Add task
                </button>
            </div>

            <div class="row g-4">
                <div class="col-lg-6">
                    <section class="task-column" aria-labelledby="pendingHeading">
                        <div class="task-column-heading">
                            <h2 id="pendingHeading">Pending</h2>
                            <span id="pendingCount" class="task-count">0</span>
                        </div>
                        <div id="pendingTasks" class="task-list"></div>
                    </section>
                </div>
                <div class="col-lg-6">
                    <section class="task-column" aria-labelledby="completedHeading">
                        <div class="task-column-heading">
                            <h2 id="completedHeading">Completed</h2>
                            <span id="completedCount" class="task-count">0</span>
                        </div>
                        <div id="completedTasks" class="task-list"></div>
                    </section>
                </div>
            </div>
        </div>

        <div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskModalTitle" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content lifesync-modal">
                    <div class="modal-header">
                        <h2 class="modal-title fs-5" id="taskModalTitle">Add task</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form id="taskForm">
                        <div class="modal-body">
                            <input type="hidden" id="taskId">
                            <div class="mb-3">
                                <label for="taskTitle" class="form-label">Title</label>
                                <input type="text" class="form-control" id="taskTitle" maxlength="100" required>
                            </div>
                            <div class="mb-3">
                                <label for="taskDescription" class="form-label">Description</label>
                                <textarea class="form-control" id="taskDescription" rows="3" maxlength="500"></textarea>
                            </div>
                            <div class="row g-3">
                                <div class="col-sm-6">
                                    <label for="taskDueDate" class="form-label">Due date</label>
                                    <input type="date" class="form-control" id="taskDueDate" required>
                                </div>
                                <div class="col-sm-6">
                                    <label for="taskPriority" class="form-label">Priority</label>
                                    <select class="form-select" id="taskPriority">
                                        <option value="Low">Low</option>
                                        <option value="Medium" selected>Medium</option>
                                        <option value="High">High</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn lifesync-secondary-btn" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn lifesync-primary-btn" id="saveTaskButton">Save task</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/tasks.js"></script>
</body>
</html>
