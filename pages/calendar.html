<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar | LifeSync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light lifesync-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand lifesync-brand" href="../index.html">
                <span class="brand-mark" aria-hidden="true">L</span><span>LifeSync</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="tasks.html">Tasks</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="calendar.html">Calendar</a></li>
                    <li class="nav-item"><a class="nav-link" href="habits.html">Habits</a></li>
                    <li class="nav-item"><a class="nav-link" href="expenses.html">Expenses</a></li>
                    <li class="nav-item"><a class="nav-link" href="study-planner.html">Study Planner</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="feature-page">
        <div class="container">
            <div class="feature-page-heading">
                <div>
                    <p class="section-eyebrow">LifeSync Calendar</p>
                    <h1>Calendar</h1>
                </div>
                <a class="btn lifesync-secondary-btn" href="tasks.html">Manage tasks</a>
            </div>

            <div class="row g-4">
                <div class="col-xl-8">
                    <section class="calendar-card" aria-label="Monthly calendar">
                        <div class="calendar-toolbar">
                            <button type="button" class="calendar-nav-btn" id="previousMonth" aria-label="Previous month">&larr;</button>
                            <h2 id="calendarMonth">Month Year</h2>
                            <button type="button" class="calendar-nav-btn" id="nextMonth" aria-label="Next month">&rarr;</button>
                        </div>
                        <div class="calendar-weekdays" aria-hidden="true">
                            <span>Sun</span><span>Mon</span><span>Tue</span>
                            <span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
                        </div>
                        <div id="calendarGrid" class="calendar-grid"></div>
                    </section>
                </div>
                <div class="col-xl-4">
                    <section class="calendar-selected-card">
                        <p class="section-eyebrow">Selected date</p>
                        <h2 id="selectedDateTitle">Tasks</h2>
                        <div id="selectedDateTasks" class="selected-date-tasks"></div>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/calendar.js"></script>
</body>
</html>
